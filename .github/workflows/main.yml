name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

# ──────────────────────────────────────────────────────────────
# JOB 1 — Quality Assurance (Lint + Unit Tests + Coverage)
# ──────────────────────────────────────────────────────────────
jobs:
  qa:
    name: QA — Lint & Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Tests with coverage
        run: npx vitest run --config vitest.config.ts --coverage

      - name: Check coverage threshold (90%)
        run: |
          node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const pct = d.total.lines.pct;
            console.log('Line coverage:', pct + '%');
            if (pct < 90) { console.error('Coverage below 90%'); process.exit(1); }
          "

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

# ──────────────────────────────────────────────────────────────
# JOB 2 — Security (npm audit + CodeQL)
# ──────────────────────────────────────────────────────────────
  security:
    name: Security — Audit & CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high severity)
        run: npm audit --audit-level=high

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild for CodeQL
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

# ──────────────────────────────────────────────────────────────
# JOB 3 — Integration Tests (Firebase Emulator)
# ──────────────────────────────────────────────────────────────
  integration:
    name: Integration Tests (Firebase Emulator)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase Emulator
        run: |
          npm install -g firebase-tools
          npx firebase setup:emulators:firestore
          npx firebase setup:emulators:auth
          npx firebase setup:emulators:storage

      - name: Run integration tests with emulators
        run: |
          npx firebase emulators:exec \
            --only auth,firestore,storage \
            --project demo-imobidoc \
            "npx vitest run --config vitest.integration.config.ts"
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
          FIREBASE_STORAGE_EMULATOR_HOST: localhost:9199

# ──────────────────────────────────────────────────────────────
# JOB 4 — Build
# ──────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [qa, security]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (development)
        if: github.ref != 'refs/heads/main'
        run: npm run build -- --configuration=development
        env:
          FIREBASE_API_KEY: ${{ secrets.DEV_FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}

      - name: Build (production)
        if: github.ref == 'refs/heads/main'
        run: npm run build -- --configuration=production
        env:
          FIREBASE_API_KEY: ${{ secrets.PROD_FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

# ──────────────────────────────────────────────────────────────
# JOB 5 — Deploy to DEV (staging)
# ──────────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy — Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Firebase Hosting (dev)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.DEV_FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}

      - name: Update Firestore indexes (dev)
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore:indexes --project ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.DEV_FIREBASE_TOKEN }}

# ──────────────────────────────────────────────────────────────
# JOB 6 — E2E + Lighthouse (against staging)
# ──────────────────────────────────────────────────────────────
  e2e-lighthouse:
    name: E2E & Lighthouse CI
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (Playwright)
        run: npx playwright test
        env:
          BASE_URL: ${{ secrets.DEV_HOSTING_URL }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: ${{ secrets.DEV_HOSTING_URL }}
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

# ──────────────────────────────────────────────────────────────
# JOB 7 — Deploy to PROD
# ──────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy — Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Firebase Hosting (prod)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.PROD_FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}

      - name: Update Firestore indexes (prod)
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore:indexes --project ${{ secrets.PROD_FIREBASE_PROJECT_ID }}
        env:
          FIREBASE_TOKEN: ${{ secrets.PROD_FIREBASE_TOKEN }}
